<app-title-page
  title="Récepteur Radio"
  [actions]="pageActions"
  (actionTriggered)="onTitleAction($event)"
/>
<div class="container-fluid">
  <div class="row gap-lg">
    <div class="col-12 col-md-12">
      <h3>Canaux Radio</h3>
      <div class="channels-list">
        @if (channels().length === 0) {
          <p class="channels-empty">Aucun canal RC detecte pour le moment.</p>
        }

        @for (channel of channels(); track channel.index) {
          <app-channel-gauge
            [title]="channel.title"
            [channelIndex]="channel.index"
            [value]="channel.value"
            [min]="channel.min"
            [max]="channel.max"
            [trim]="channel.trim"
            [reversed]="channel.reversed"
            [selectedMode]="channel.modeLabel"
            [modeOptions]="channel.modeOptions"
            [showMode]="channel.showMode"
            [deadZone]="channel.deadZone"
            [showDeadZone]="channel.showDeadZone"
            unit="us"
            (selectedModeChange)="onModeChange(channel.index, $event)"
            (reversedChange)="onReversedChange(channel.index, $event)"
            (deadZoneChange)="onDeadZoneChange(channel.index, $event)"
          />
        }
      </div>
    </div>
  </div>
</div>

<app-popup
  [open]="isCalibrationDialogOpen()"
  title="Calibration radio"
  [showDefaultActions]="false"
  (cancel)="closeCalibrationDialog()"
  (closed)="closeCalibrationDialog()"
>
  <app-radio-calibration popup-body></app-radio-calibration>
</app-popup>
