<app-title-page
  title="Configuration"
  actionLabel="Wiki"
  actionUrl="https://ardupilot.org/copter/docs/common-downloading-and-analyzing-data-logs-in-mission-planner.html"
/>
<section class="grid">
  @for (section of parameterSections(); track section.id) {
    <app-param-table
      [section]="section"
      [disabled]="!isConnected()"
      (valueChange)="onParameterValueChange($event)"
    />
  }
</section>
