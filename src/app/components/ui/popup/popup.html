@if (open()) {
	<div class="popup__backdrop" role="presentation" (click)="onBackdropClick($event)">
		<section class="popup__card" role="dialog" aria-modal="true" [attr.aria-label]="title()">
			<h2 class="popup__title">{{ title() }}</h2>

			<div class="popup__content">
				<ng-content select="[popup-body]"></ng-content>
			</div>

			<div class="popup__actions">
				<ng-content select="[popup-actions]"></ng-content>
				@if (showDefaultActions()) {
					<button type="button" class="popup__btn popup__btn--confirm" (click)="onConfirm()">
						{{ confirmLabel() }}
					</button>
					<button type="button" class="popup__btn popup__btn--cancel" (click)="onCancel()">
						{{ cancelLabel() }}
					</button>
				}
			</div>
		</section>
	</div>
}
