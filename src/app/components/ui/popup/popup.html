@if (open()) {
	<div class="popup-backdrop" role="presentation" (click)="onBackdropClick($event)">
		<section class="popup-card" role="dialog" aria-modal="true" [attr.aria-label]="title()">
			<h2 class="popup-title">{{ title() }}</h2>

			<div class="popup-content">
				<ng-content select="[popup-body]"></ng-content>
				@if (paragraphs().length > 0) {
					@for (paragraph of paragraphs(); track paragraph) {
						<p>{{ paragraph }}</p>
					}
				}
			</div>

			<div class="popup-actions">
				<ng-content select="[popup-actions]"></ng-content>
				@if (showDefaultActions()) {
					<button type="button" class="popup-btn popup-btn--confirm" (click)="onConfirm()">
						{{ confirmLabel() }}
					</button>
					<button type="button" class="popup-btn popup-btn--cancel" (click)="onCancel()">
						{{ cancelLabel() }}
					</button>
				}
			</div>
		</section>
	</div>
}
