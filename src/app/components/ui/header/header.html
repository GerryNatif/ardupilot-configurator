<div class="headerbar" [class.expand]="isExpanded">
  <button id="menu_btn" type="button" aria-label="Toggle menu" (click)="onMenuToggle()">
    <span
      class="menu_btn__icon"
      aria-hidden="true"
      [style.--icon-url]="'url(' + getIconPath('menu.svg') + ')'"
    ></span>
  </button>

  <div class="brand-block">
    <img class="brand-block__logo" [src]="logoPath" alt="Ardupilot" />
    @if (isConnected()) {
      <div class="brand-block__version">
        {{ detectedFirmware() }} version {{ detectedVersion() }}
      </div>
    }
  </div>

  @if (isConnected()) {
    <div class="header-status" [class.reveal]="isExpanded">
      <app-sensors-status></app-sensors-status>

      <div id="dataflash_wrapper_global">
        <div class="legend">Espace Dataflash</div>
        <progress class="dataflash-progress_global" max="100" value="0"></progress>
      </div>
    </div>
  }

  <div class="header-actions" [class.reveal]="isExpanded">
    @if (!isConnected()) {
      <div class="web-port-picker" [class.reveal]="isExpanded">
        <select class="web-port-picker__select" [(ngModel)]="selectedBaud" aria-label="Baud rate">
          <option value="115200">115200</option>
          <option value="230400">230400</option>
          <option value="460800">460800</option>
        </select>
      </div>
    }

    <div id="header_buttons">
      <div class="firmware_flasher_button">
        <a
          class="firmware_flasher_button__link"
          href="#"
          aria-label="Firmware Flasher"
          [style.--icon-url]="'url(' + getIconPath('chipset.svg') + ')'"
        >
          <span class="header_button__icon" aria-hidden="true"></span>
        </a>
        <div class="firmware_flasher_button__label">Mise a jour du micrologiciel</div>
      </div>
      <div class="connection_button">
        <a
          class="connection_button__link"
          [class.connection_button__link--connected]="!isConnected()"
          [class.connection_button__link--disconnect]="isConnected()"
          href="#"
          [attr.aria-label]="connectionLabel()"
          [style.--icon-url]="
            'url(' + getIconPath(isConnected() ? 'no-usb-cable.svg' : 'usb-cable.svg') + ')'
          "
          (click)="onConnectionToggle($event)"
        >
          <span class="header_button__icon" aria-hidden="true"></span>
        </a>
        <div class="connection_button__label">{{ connectionLabel() }}</div>
      </div>
    </div>
    <button id="reveal_btn" type="button" aria-label="Reveal header" (click)="onRevealToggle()">
      <span
        class="reveal_btn__icon"
        aria-hidden="true"
        [style.--icon-url]="'url(' + getIconPath('chevron-down.svg') + ')'"
      ></span>
    </button>
  </div>
</div>
