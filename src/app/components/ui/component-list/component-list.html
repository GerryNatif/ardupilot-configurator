<div class="component-list">
	<ul class="component-list__items" aria-label="Current model components">
		@for (item of items(); track item.id) {
			<li
				[class.component-list__item--draggable]="enableDrag()"
				[attr.draggable]="enableDrag() ? 'true' : null"
				(dragstart)="onItemDragStart(item.id, $event)"
			>
				<app-card
					[title]="item.label"
					[details]="getCardDetails(item)"
					[class.is-selected]="isSelected(item.id)"
					(click)="onItemClick(item.id); $event.stopPropagation()"
				></app-card>
			</li>
		}
	</ul>
</div>
